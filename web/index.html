<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gh-download · 本地下载器</title>
<style>
  :root { --bg:#0f1115; --fg:#e6e6e6; --muted:#9aa0a6; --line:#262a33; --accent:#2dd4bf; --card:#161a21; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  label { display:block; font-size:.82rem; color:var(--muted); margin: 6px 0 4px; }
  input[type=text] { width:100%; padding:9px 11px; background:#0c0e12; border:1px solid var(--line); border-radius:8px; color:var(--fg); font:inherit; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > div { flex:1 1 180px; }
  button { background:var(--accent); color:#04201c; border:0; border-radius:8px; padding:9px 16px; font:600 0.92rem/1 inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .actions { display:flex; gap:10px; margin-top:14px; align-items:center; }
  ul.assets { list-style:none; margin:8px 0 0; padding:0; }
  ul.assets li { display:flex; align-items:center; gap:10px; padding:7px 4px; border-bottom:1px solid var(--line); }
  ul.assets li:last-child { border-bottom:0; }
  .nm { flex:1; word-break:break-all; }
  .sz { color:var(--muted); font-size:.8rem; white-space:nowrap; }
  pre#log { background:#0a0c10; border:1px solid var(--line); border-radius:10px; padding:12px; height:280px; overflow:auto; white-space:pre-wrap; font:12px/1.45 ui-monospace,Menlo,Consolas,monospace; }
  a { color: var(--accent); }
  .hint { color: var(--muted); font-size:.82rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>gh-download <span>· 本地下载器</span></h1>
  <p class="sub">多镜像测速 + Range 校验 → aria2 多源并行 → 断点续传 →（有则）sha256。本地运行，仅下载你指定的 GitHub 资产。</p>

  <div class="card">
    <div class="row">
      <div>
        <label>仓库（owner/repo）</label>
        <input type="text" id="repo" placeholder="NationalSecurityAgency/ghidra">
      </div>
      <div>
        <label>标签（tag）</label>
        <input type="text" id="tag" placeholder="Ghidra_12.1.4_build">
      </div>
    </div>
    <label>或者：直接粘贴一个 GitHub 下载链接</label>
    <input type="text" id="url" placeholder="https://github.com/owner/repo/releases/download/tag/file.zip">
    <div class="row" style="margin-top:8px">
      <div>
        <label>下载目录</label>
        <input type="text" id="dir" value="./downloads">
      </div>
    </div>
    <div class="actions">
      <button id="list">列出资产</button>
      <button id="dl" class="ghost" disabled>下载选中</button>
      <span class="hint" id="status"></span>
    </div>
  </div>

  <div class="card">
    <div id="listbox">填入仓库/标签后点「列出资产」；或直接填 URL 后点「下载选中」。</div>
  </div>

  <div class="card">
    <label>日志</label>
    <pre id="log"></pre>
  </div>

  <p class="hint">镜像/并发可用环境变量调：<code>EMBEDAI_MIRRORS</code>、<code>EMBEDAI_JOBS</code>、<code>EMBEDAI_CONN</code>。第三方镜像不可信，凡有 SHA256SUMS 会自动校验。</p>
</div>

<script>
const $ = (id) => document.getElementById(id);
let assets = [];

function human(n){ if(!n) return ''; const u=['B','KB','MB','GB']; let i=0; while(n>=1024&&i<u.length-1){n/=1024;i++;} return n.toFixed(i?1:0)+u[i]; }
function logln(s){ const p=$('log'); p.textContent += s + '\n'; p.scrollTop = p.scrollHeight; }

$('list').onclick = async () => {
  const repo = $('repo').value.trim(), tag = $('tag').value.trim();
  if (!repo || !tag) { $('status').textContent = '请填仓库和标签（或直接填 URL）'; return; }
  $('status').textContent = '查询中…'; $('listbox').textContent = '';
  try {
    const r = await fetch('/api/assets?repo=' + encodeURIComponent(repo) + '&tag=' + encodeURIComponent(tag));
    const j = await r.json();
    if (j.error) { $('status').textContent = '错误：' + j.error; return; }
    assets = j;
    if (!assets.length) { $('status').textContent = '没有资产'; return; }
    const ul = document.createElement('ul'); ul.className = 'assets';
    assets.forEach((a, i) => {
      const li = document.createElement('li');
      li.innerHTML = '<input type="checkbox" checked data-i="' + i + '"><span class="nm"></span><span class="sz">' + human(a.size) + '</span>';
      li.querySelector('.nm').textContent = a.name;
      ul.appendChild(li);
    });
    $('listbox').innerHTML = ''; $('listbox').appendChild(ul);
    $('dl').disabled = false; $('status').textContent = assets.length + ' 个资产';
  } catch (e) { $('status').textContent = '错误：' + e; }
};

$('dl').onclick = async () => {
  const url = $('url').value.trim();
  let items = [];
  if (url) { items = [{ name: url.split('/').pop(), url }]; }
  else {
    items = [...document.querySelectorAll('#listbox input[type=checkbox]:checked')].map(c => assets[+c.dataset.i]);
  }
  if (!items.length) { $('status').textContent = '没有选中项'; return; }
  $('log').textContent = ''; $('dl').disabled = true; $('status').textContent = '下载中…';
  try {
    const r = await fetch('/api/download', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ items, dir: $('dir').value.trim() || './downloads' }) });
    const reader = r.body.getReader(); const dec = new TextDecoder();
    while (true) { const { done, value } = await reader.read(); if (done) break; $('log').textContent += dec.decode(value, { stream:true }); $('log').scrollTop = $('log').scrollHeight; }
    $('status').textContent = '完成';
  } catch (e) { $('status').textContent = '错误：' + e; }
  $('dl').disabled = false;
};
</script>
</body>
</html>
